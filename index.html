<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulations — interactive universe sandbox</title>
  <meta name="theme-color" content="#111626" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <strong class="brand">⚛ Simulations</strong>
    <select id="sim-select" aria-label="Simulation"></select>
    <select id="scenario-select" aria-label="Scenario"></select>
    <button id="learn" title="Guided lessons and challenges">🎓 Learn</button>
    <button id="play">❚❚ Pause</button>
    <button id="step" title="Advance one frame [.]">Step</button>
    <button id="reset" title="Reload the current scenario">Reset</button>
    <button id="fit" title="Fit the view [f]">Fit view</button>
    <span class="group">
      <button id="undo" title="Undo [Ctrl+Z]" disabled>↶ Undo</button>
      <button id="redo" title="Redo [Ctrl+Shift+Z]" disabled>↷ Redo</button>
    </span>
    <span class="group">
      <button id="save" title="Save the world to a file [Ctrl+S]">Save</button>
      <button id="load" title="Load a saved world">Load</button>
      <input id="load-file" type="file" accept=".json,application/json" hidden />
      <button id="share" title="Copy a link to this simulation, scenario and parameters">Share link</button>
      <button id="csv" title="Download the recorded statistics as CSV">Export CSV</button>
    </span>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <label class="speed">Speed <input id="speed" type="range" min="-3" max="3" step="0.25" value="0" /> <span id="speed-label">1×</span></label>
    <span id="clock" class="clock"></span>
    <span id="perf" class="muted small"></span>
  </header>

  <aside class="panel left">
    <section>
      <h2 id="sim-title"></h2>
      <p id="sim-description" class="muted small"></p>
      <button id="model-btn" class="link" title="Equations, simplifications and references for this simulation">ⓘ Model &amp; assumptions</button>
    </section>
    <section>
      <h2>Tools</h2>
      <div id="tools" class="tools"></div>
      <p id="tool-hint" class="muted small"></p>
      <label id="kind-row" class="field">Object to add <select id="kind-select"></select></label>
      <label id="brush-row" class="field">Brush size <input id="brush" type="range" min="5" max="150" value="40" /> <span id="brush-label">40px</span></label>
      <div id="energy-row">
        <p class="small"><b id="energy-label"></b></p>
        <label class="field">Strength <input id="strength" type="range" min="0.1" max="4" step="0.1" value="1" /></label>
        <label class="check"><input id="invert" type="checkbox" /> Invert (same as holding Shift)</label>
      </div>
      <p class="muted small">Wheel: zoom · Right-drag: pan · Space: play/pause · Del: remove selection</p>
    </section>
    <section>
      <h2>Parameters</h2>
      <div id="params"></div>
    </section>
  </aside>

  <main class="stage">
    <canvas id="world"></canvas>
    <canvas id="chart"></canvas>
  </main>

  <aside class="panel right">
    <section id="lesson" class="lesson" hidden aria-live="polite"></section>
    <section>
      <h2>Inspector</h2>
      <div id="inspector"></div>
    </section>
    <section>
      <h2>Statistics</h2>
      <div id="stats"></div>
    </section>
  </aside>

  <dialog id="model-dialog" aria-labelledby="model-title">
    <form method="dialog" class="dialog-head">
      <h2 id="model-title"></h2>
      <button aria-label="Close">✕</button>
    </form>
    <div id="model-body"></div>
  </dialog>

  <dialog id="learn-dialog" aria-labelledby="learn-title">
    <form method="dialog" class="dialog-head">
      <h2 id="learn-title">Learn</h2>
      <button aria-label="Close">✕</button>
    </form>
    <div id="learn-body"></div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
